<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get Transform Origin</title>
  </head>
  <body>
    <div class="page">
      <aside class="side-panel open">
        <div class="side-panel-header"><span class="side-panel-title">Origin</span></div>
        <div class="side-panel-body">
          <div class="sort-filter-section">
            <div class="sort-filter-section-title">Images</div>
            <ul class="thumbs" id="thumbs"></ul>
            <p class="help" id="thumbsEmpty">No images yet</p>
          </div>
          <div class="sort-filter-section">
            <div class="sort-filter-section-title">Position (%)</div>
            <div class="sort-group"><label for="xInput">X</label><input id="xInput" class="spinner-input" type="number" step="0.01" disabled /></div>
            <div class="sort-group"><label for="yInput">Y</label><input id="yInput" class="spinner-input" type="number" step="0.01" disabled /></div>
            <div class="sort-group"><label for="precision">Decimals</label><input id="precision" class="spinner-input" type="number" min="0" max="6" value="2" /></div>
          </div>
          <div class="sort-filter-section">
            <div class="sort-filter-section-title">Output</div>
            <pre class="code" id="out">Upload an image, then click it to set the origin</pre>
            <div class="row">
              <button class="chip-button" id="copyReact" disabled>Copy React</button>
              <button class="chip-button" id="copyCss" disabled>Copy CSS</button>
              <button class="chip-button" id="copyAll" disabled>Copy all</button>
            </div>
            <p class="help" id="px"></p>
          </div>
          <div class="sort-filter-section">
            <div class="sort-filter-section-title">Test the origin</div>
            <div class="sort-group"><label for="rot">Rotate °</label><input id="rot" class="spinner-input" type="range" min="-180" max="180" value="0" disabled /></div>
            <div class="sort-group"><label for="scl">Scale</label><input id="scl" class="spinner-input" type="range" min="0.2" max="3" step="0.05" value="1" disabled /></div>
            <button class="chip-button" id="reset" disabled>Reset test</button>
          </div>
        </div>
      </aside>

      <div class="panel">
        <header class="panel-header">
          <div id="dropzone">
            <input id="file" accept="image/*" multiple hidden type="file" />
            <button class="btn btn-primary" id="upload" type="button">Upload Image</button>
            <span id="dropHint">or drag &amp; drop / paste images</span>
          </div>
          <button class="icon-button" id="theme" type="button" title="Toggle theme" aria-label="Toggle theme">◐</button>
        </header>
        <div class="stage" id="stage">
          <div class="hint-empty" id="empty">Upload or drop an image, then click to set the transform origin</div>
          <div class="frame" id="frame" hidden>
            <img id="img" alt="Uploaded" draggable="false" />
            <div class="marker" id="marker"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
